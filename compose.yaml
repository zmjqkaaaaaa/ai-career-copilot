name: career-copilot

x-backend: &backend
  image: career-copilot-backend:${IMAGE_TAG:-local}
  build: ./backend
  init: true

x-settings: &settings
  APP_ENV: ${APP_ENV:-development}
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-career_copilot}
  DB_USER: ${DB_USER:-career_app}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment env file}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment env file}
  JWT_MINUTES: ${JWT_MINUTES:-30}
  CORS_ORIGINS: '["http://127.0.0.1:${LOCAL_PORT:-8080}","http://localhost:${LOCAL_PORT:-8080}"]'
  RESUME_STORAGE_DIR: /data/resumes

x-runtime: &runtime
  <<: *settings
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_JSON_MODE: ${LLM_JSON_MODE:-json_object}
  LLM_THINKING: ${LLM_THINKING:-}
  LLM_THINKING_FORMAT: ${LLM_THINKING_FORMAT:-enable_thinking}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-75}
  LLM_PRICES: "${LLM_PRICES:-null}"
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-5500}
  LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-36000}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  WORKER_HEARTBEAT_MAX_AGE: ${WORKER_HEARTBEAT_MAX_AGE:-300}

x-logs: &logs
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logs
    environment:
      MYSQL_DATABASE: ${DB_NAME:-career_copilot}
      MYSQL_USER: ${DB_USER:-career_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the deployment env file}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s

  migrate:
    <<: *backend
    logging: *logs
    environment: *settings
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]

  api:
    <<: *backend
    restart: unless-stopped
    logging: *logs
    environment: *runtime
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "${PROXY_IP:-172.30.60.2}", "--no-access-log"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [proxy, database]
    volumes:
      - resumes:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5

  worker:
    <<: *backend
    restart: unless-stopped
    logging: *logs
    environment: *runtime
    command: ["python", "-m", "app.resume_worker"]
    stop_signal: SIGINT
    stop_grace_period: 3m
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database, worker_egress]
    volumes:
      - resumes:/data

  frontend:
    image: career-copilot-frontend:${IMAGE_TAG:-local}
    build: ./frontend
    restart: unless-stopped
    logging: *logs
    environment:
      SITE_ADDRESS: ":80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: ${PROXY_IP:-172.30.60.2}
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

networks:
  database:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.60.0/24}
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.30.60.128/25}
  worker_egress: {}

volumes:
  mysql_data:
  resumes:
  caddy_data:
  caddy_config:
