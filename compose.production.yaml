name: career-copilot-prod

services:
  db:
    mem_limit: 1536m
    cpus: 2
  migrate:
    image: career-copilot-backend:${IMAGE_TAG:?Set IMAGE_TAG to the release identifier}
    mem_limit: 384m
    cpus: 1
    environment:
      APP_ENV: production
      CORS_ORIGINS: '["https://${PUBLIC_HOST:?Set PUBLIC_HOST to your public DNS hostname}"]'
  api:
    image: career-copilot-backend:${IMAGE_TAG:?Set IMAGE_TAG to the release identifier}
    mem_limit: 768m
    cpus: 2
    environment:
      APP_ENV: production
      CORS_ORIGINS: '["https://${PUBLIC_HOST:?Set PUBLIC_HOST to your public DNS hostname}"]'
  worker:
    image: career-copilot-backend:${IMAGE_TAG:?Set IMAGE_TAG to the release identifier}
    mem_limit: 1024m
    cpus: 2
    environment:
      APP_ENV: production
      CORS_ORIGINS: '["https://${PUBLIC_HOST:?Set PUBLIC_HOST to your public DNS hostname}"]'
  frontend:
    image: career-copilot-frontend:${IMAGE_TAG:?Set IMAGE_TAG to the release identifier}
    mem_limit: 256m
    cpus: 1
    environment:
      SITE_ADDRESS: "https://${PUBLIC_HOST:?Set PUBLIC_HOST to your public DNS hostname}"
    ports: !override
      - "80:80"
      - "443:443"
